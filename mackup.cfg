[storage]
engine = file_system
path = Library/CloudStorage/ProtonDrive-hej@jegerdaniel.dk-folder/Sync/ # Mackup appends "Mackup" to this. Relative to homedir, so files live at ~/Library/CloudStorage/ProtonDrive-.../Sync/Mackup
# Proton Drive mounts via macOS File Provider, so this path is identical on every Mac
# signed into the same Proton account — no per-machine override needed.


# Use mackup list to get a list of valid application names. Don't use fancy names (with spaces) here.
[applications_to_ignore]
oh-my-zsh # mackups breaks updating with custom stuff, and it should be synced thorugh the .dotfiles repo anyways : https://github.com/lra/mackup/issues/1384
zsh # please keep the zsh file here
mackup # Please keep the mackup files here, otherwise we have no control
goku
p10k # ~/.p10k.zsh is owned by this repo via dotbot link — mackup must not clobber it
curl # holds .netrc (stale Heroku creds) and .curlrc — don't sync credentials between machines