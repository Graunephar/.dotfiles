[storage]
engine = file_system
path = .graunephar-private-mackup-sync/ # Mackup appender "Mackup". Privat repo paa almindelig disk - ALDRIG en cloud-mount: root-daemoner kan ikke laese File Provider-stier


# Use mackup list to get a list of valid application names. Don't use fancy names (with spaces) here.
[applications_to_ignore]
oh-my-zsh # mackups breaks updating with custom stuff, and it should be synced thorugh the .dotfiles repo anyways : https://github.com/lra/mackup/issues/1384
zsh # please keep the zsh file here
mackup # Please keep the mackup files here, otherwise we have no control
goku
p10k # ~/.p10k.zsh is owned by this repo via dotbot link — mackup must not clobber it
curl # holds .netrc (stale Heroku creds) and .curlrc — don't sync credentials between machines
ssh # ~/.ssh/config is machine-specific: the Studio has only id_ed25519, the MacBook id_rsa. A shared `Host *` with IdentitiesOnly and one hardcoded IdentityFile locks the other mac out of every host it can reach
azure # ~/.azure holds msal_token_cache.json (live refresh tokens) plus ~4000 installed CLI extensions — neither belongs in cloud sync
adobe-camera-raw # 327 MB neurale modelvaegte + OOBE-cache. Bruges ikke laengere, og over GitHubs 100 MB filgraense
