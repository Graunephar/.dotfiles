# Custom mackup definition for BetterTouchTool.
# Files in ~/.mackup/ override mackup's stock definitions.
#
# Why this exists: mackup ships a bettertouchtool definition targeting
# `bttdata2` and `btt_data_store.v2`. BTT has not used those names for years -
# it writes `btt_data_store.version_<version>_build_<date>`, which changes on
# every update (6.748 -> 6.760 -> 6.773 within days). So the stock definition
# matched nothing and silently backed up only the plist. Config was never
# synced on either Mac.
#
# Targeting the directory instead of filenames survives every BTT update.
#
# Caveats:
#  - The store is SQLite. Quit BTT before `mackup backup` or `mackup restore`,
#    or the running app overwrites what you just restored.
#  - Two machines editing between syncs = last backup wins, no merge.

[application]
name = BetterTouchTool

[configuration_files]
Library/Application Support/BetterTouchTool
Library/Preferences/com.hegenberg.BetterTouchTool.plist
