- defaults:
    link:
      relink: true

- create:
    - ~/.config
    - ~/Git
    - ~/.config/colorls/

- clean: ['~']

#https://github.com/d12frosted/dotbot-brew
- brew:
    - git
    - php
    - cowsay
    - thefuck
    - zsh
    - mackup
    - wget
    - bitwarden-cli
    - ffmpeg
    - highlight
    - fzf
    - bat
    - ripgrep
    - diff-so-fancy
    - z
    - autojump
    - navi
    - lolcat
    - sl
    - figlet
    - npm
    - yarn
    - clipboard
    - ruby # needed for colorls — system Ruby is locked down on modern macOS


- cask: [iterm2]

# install stuff through shell here
- shell:
    - curl -s "https://get.sdkman.io" | bash

# install oh my sh and plugins
- shell:
    - sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" || true #install Oh My Zsh! - || true ignores the error the script will make if its already installed
    - |
      # MesloLGS NF - the font powerlevel10k and the iTerm profiles expect.
      # NOT the same as the `font-meslo-lg-nerd-font` cask, which installs
      # "MesloLGS Nerd Font" - a different PostScript name that the profiles
      # do not match, so iTerm silently falls back and p10k icons break.
      cd ~/Library/Fonts && for f in Regular Bold Italic "Bold Italic"; do
        [ -f "MesloLGS NF $f.ttf" ] || curl -fsSL \
          "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20${f// /%20}.ttf" \
          -o "MesloLGS NF $f.ttf"
      done
    - "$(brew --prefix ruby)/bin/gem install colorls --no-document" # NOT `sudo gem install`: system Ruby (2.6) is locked down on modern macOS, that command fails and aborts the whole install because of `set -e`

- link:
    ~/.zshrc:
        force: true
        path: ./zsh/zshrc
    ~/.p10k.zsh:
        force: true
        path: ./zsh/p10k.zsh
    ~/.oh-my-zsh/custom: zsh/custom_folder #plugins and themes
    ~/.config/colorls/dark_colors.yaml: zsh/dark_colors.yaml
    ~/.mackup.cfg: ./mackup.cfg
    # Custom mackup app definitions. These override mackup's stock ones.
    # bettertouchtool.cfg fixes a definition that has been silently broken for
    # years - see the comments in that file.
    ~/.mackup/bettertouchtool.cfg: ./mackup/bettertouchtool.cfg



# Link stuff through shell here
- shell:
    - [mkdir -p ~/.config && ln -sf ~/.dotfiles/karabiner.edn ~/.config/karabiner.edn] # no sudo: ~/.config is owned by you. The old `sudo` made a root-owned symlink for no reason.

# End by running external setup tools
#
# NOTE: `mackup restore` deliberately does NOT run here. It overwrites local
# config with whatever is in the Mackup folder - on the writer machine that
# would destroy the only good copy. Restore belongs to the reader's host
# profile (hosts/Daniels-Mac-Studio.conf.yaml), and even there it is manual:
# use `mackup-pull <app>` with the app quit.
- shell:
    - ./misc/install-crontab.sh # merges misc/cronjobs into the crontab. Does NOT replace it — `crontab <file>` would wipe every job not in that file.

# --- VNC hotkey pass-through -------------------------------------------------
# While the Screen Sharing window is focused, suspend the LOCAL BTT so Hyper
# chords (Caps Lock+R etc.) forward into the remote session instead of being
# eaten locally. No-op on a machine that is never a VNC client.
- create:
    - ~/Library/LaunchAgents

- link:
    ~/Library/LaunchAgents/dk.graunephar.vnc-passthrough.plist:
        force: true
        path: ./misc/dk.graunephar.vnc-passthrough.plist

- shell:
    - [launchctl bootout "gui/$(id -u)/dk.graunephar.vnc-passthrough" 2>/dev/null; launchctl bootstrap "gui/$(id -u)" ~/Library/LaunchAgents/dk.graunephar.vnc-passthrough.plist, "load vnc-passthrough agent"]
